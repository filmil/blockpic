# SPDX-License-Identifier: Apache-2.0
# Publishes a release to the Bazel Central Registry, through filmil's fork.
# Called by release.yml after publish.yml; can be started by hand too.
#
# attest: true, and only here. BCR presubmit verifies MODULE.bazel and
# source.json against this workflow's builder id, and the source archive
# against release_ruleset.yaml's. Once a version is published with
# attestations, every later one must have them too.
name: "Publish on Bazel Central Registry"

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  publish:
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0"
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: filmil/bazel-central-registry
      attest: true
      # Ready for review when it opens: a draft is not reviewed, and BCR's
      # stale bot closes it after 44 days.
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
