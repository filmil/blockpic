# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly on the 1st
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  # The scheduled run used to bump a version whether or not anything had
  # landed, so the same tree was released again and again (see the tags that
  # share one commit). This job asks the only question that matters -- did
  # anything get committed since the last release? -- and every job below
  # hangs off the answer.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: `git describe` needs both, and the default
          # shallow checkout has neither.
          fetch-depth: 0
      - name: Look for commits since the last release
        id: changes
        run: |
          set -o errexit -o nounset -o pipefail
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "No tag yet; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "${latest}")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is already released as ${latest}. Nothing to release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "$(git rev-list --count "${latest}"..HEAD) commit(s) since ${latest}; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  tag:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_action.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag_action
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor

  build:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-amd64
            platform: "@rules_go//go/toolchain:linux_amd64"
          - os: macos-latest
            arch: darwin-amd64
            platform: "@rules_go//go/toolchain:darwin_amd64"
          - os: macos-latest
            arch: darwin-arm64
            platform: "@rules_go//go/toolchain:darwin_arm64"
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bazel
        uses: abhinavsingh/setup-bazel@v3
        with:
          version: 9.0.1
      - name: Set up Bazel cache key
        id: cache-key
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ matrix.arch }}-${{ steps.cache-key.outputs.date }}-${{ hashFiles('**/BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.arch }}-${{ steps.cache-key.outputs.date }}-
      - name: Build Binary
        run: |
          bazel build --disk_cache=~/.cache/bazel/disk_cache --repository_cache=~/.cache/bazel/repo_cache             --platforms=${{ matrix.platform }} //cmd/blockpic:blockpic
          cp bazel-bin/cmd/blockpic/blockpic_/blockpic blockpic-${{ matrix.arch }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockpic-${{ matrix.arch }}
          path: blockpic-${{ matrix.arch }}

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: Release ${{ needs.tag.outputs.new_tag }}
          files: artifacts/*
          generate_release_notes: true
