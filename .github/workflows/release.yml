# SPDX-License-Identifier: Apache-2.0
# Tags a release when commits since the last one ask for it, releases its
# attested source archive, attaches the binaries and the sample PDFs, and
# publishes the module to filmil's registry and then to the Bazel Central
# Registry.
name: Release

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly on the 1st
  workflow_dispatch: # Manual trigger

jobs:
  tag:
    runs-on: ubuntu-latest
    # Pushes the tag. Job-level, because a repository whose default
    # workflow permission is read-only fails the push otherwise.
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag action reads the commits since the previous tag; a
          # shallow checkout has none, and it would release nothing.
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          # No commit that asks for a release (feat, fix, or a breaking
          # change) means no tag, and every job below is skipped. The same
          # tree is not released twice.
          default_bump: false

  # Runs the tests, builds the source archive with
  # .github/workflows/release_prep.sh, attests it, and creates the release.
  # Not interchangeable with a local workflow: BCR verifies the archive's
  # attestation against this workflow's builder id.
  source_release:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    permissions:
      contents: write      # upload release files
      id-token: write      # attest provenance
      attestations: write  # attest provenance
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
      release_files: blockpic-${{ needs.tag.outputs.tag_name }}.zip
      prerelease: false

  build:
    needs: [tag, source_release]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-amd64
            platform: "@rules_go//go/toolchain:linux_amd64"
          - os: macos-latest
            arch: darwin-amd64
            platform: "@rules_go//go/toolchain:darwin_amd64"
          - os: macos-latest
            arch: darwin-arm64
            platform: "@rules_go//go/toolchain:darwin_arm64"
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag_name }}
      - name: Setup Bazel
        uses: abhinavsingh/setup-bazel@v3
        with:
          version: 9.3.0
      - name: Build Binary
        run: |
          bazel build --platforms=${{ matrix.platform }} //cmd/blockpic:blockpic
          cp bazel-bin/cmd/blockpic/blockpic_/blockpic blockpic-${{ matrix.arch }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockpic-${{ matrix.arch }}
          path: blockpic-${{ matrix.arch }}

  # The sample documents under //samples, built from the tag, so the
  # release carries the figures that its own blockpic draws.
  samples:
    needs: [tag, source_release]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag_name }}
      - name: Setup Bazel
        uses: abhinavsingh/setup-bazel@v3
        with:
          version: 9.3.0
      - name: Build the sample PDFs
        run: |
          set -eu
          bazel build //samples:pdfs
          files="$(bazel cquery --output=files //samples:pdfs)"
          mkdir -p samples-out
          cp $files samples-out/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samples
          path: samples-out/*.pdf

  # The release itself was created by source_release; this adds the
  # binaries and the PDFs to it.
  attach:
    needs: [tag, build, samples]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.tag.outputs.tag_name }}" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  # filmil's registry first, without attestation; then BCR, with it. Only
  # one publish may attest (see publish.yml), and the fixed order keeps it
  # that way.
  publish:
    needs: [tag, attach]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets: inherit

  publish-bcr:
    needs: [tag, publish]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-bcr.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets: inherit
