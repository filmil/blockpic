# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # 24.04, not 22.04: the book's TeX tools (bazel_ebook 3.0.2) come from a
    # root filesystem with glibc 2.39, but start under the host's dynamic
    # loader, and 22.04's glibc 2.35 cannot load that libc.so.6
    # ("undefined symbol: __tunable_is_initialized, version GLIBC_PRIVATE").
    # Back to any runner once bazel_ebook starts them with its own loader.
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: abhinavsingh/setup-bazel@v3
        with:
          version: 9.3.0

      - name: Set up Bazel cache key
        id: cache-key
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          # Using the date in the key to ensure the cache "expires" (is not used) every 24 hours.
          key: bazel-${{ steps.cache-key.outputs.date }}-${{ hashFiles('**/BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ steps.cache-key.outputs.date }}-

      - name: Test
        run: bazel test --disk_cache=~/.cache/bazel/disk_cache --repository_cache=~/.cache/bazel/repo_cache //...

  # blockpic as another module uses it: integration/ depends on it through
  # a local_path_override and resolves everything else from the Bazel
  # Central Registry alone, as BCR presubmit will. Both supported Bazel
  # majors; bazelisk on the runner takes the version from USE_BAZEL_VERSION.
  integration:
    strategy:
      fail-fast: false
      matrix:
        # As BCR presubmit (.bcr/presubmit.yml), as far as GitHub's runners go.
        os: ["ubuntu-22.04", "ubuntu-24.04", "macos-latest"]
        bazel: ["8.x", "9.x"]
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails if anything blockpic needs is missing from BCR. No rc files,
      # so no custom registry can stand in for a missing module.
      - name: Dependencies resolve from BCR alone
        run: cd integration && bazel --ignore_all_rc_files mod graph --registry=https://bcr.bazel.build > /dev/null

      - name: Integration test
        run: cd integration && bazel test --test_output=errors //...

  deploy-docs:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy_docs.yml
    secrets:
      HDLFACTORY_DEPLOY_KEY: ${{ secrets.HDLFACTORY_DEPLOY_KEY }}
