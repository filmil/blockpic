<style>
/* CSS to style the TOC as a left navigation sidebar */
@media screen and (min-width: 900px) {
    body:has(#TOC) {
        margin-left: 320px;
        max-width: calc(100% - 360px);
    }
    #TOC {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 300px;
        overflow-y: auto;
        padding: 20px;
        background-color: #f8f9fa;
        border-right: 1px solid #e9ecef;
        font-size: 0.9em;
        box-shadow: 2px 0 5px rgba(0,0,0,0.05);
    }
    /* Custom scrollbar for a prettier look */
    #TOC::-webkit-scrollbar {
        width: 8px;
    }
    #TOC::-webkit-scrollbar-track {
        background: #f8f9fa;
    }
    #TOC::-webkit-scrollbar-thumb {
        background: #ced4da;
        border-radius: 4px;
    }
    #TOC::-webkit-scrollbar-thumb:hover {
        background: #adb5bd;
    }
}

/* Base styles for the TOC list */
#TOC ul {
    list-style-type: none;
    padding-left: 15px;
    margin-top: 5px;
    margin-bottom: 5px;
}
#TOC > ul {
    padding-left: 0;
}
#TOC a {
    text-decoration: none;
    color: #495057;
    display: block;
    padding: 4px 0;
    line-height: 1.3;
    transition: color 0.2s ease;
}
#TOC a:hover {
    color: #0056b3;
}

/* Base styles */
body {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    color: #333;
}
h1, h2, h3, h4, h5, h6 {
    color: #222;
}
pre {
    font-size: 0.75em;
    background: #f8f8f8;
    padding: 10px;
    border-radius: 5px;
    overflow-x: auto;
}
code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    background: #f8f8f8;
    padding: 2px 4px;
    border-radius: 3px;
}
pre code {
    padding: 0;
    background: transparent;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Add TOC to pages that don't have it (chunked pages)
    if (!document.getElementById('TOC')) {
        fetch('index.html')
            .then(response => response.text())
            .then(html => {
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var toc = doc.getElementById('TOC');
                if (toc) {
                    document.body.insertBefore(toc, document.body.firstChild);
                }
            })
            .catch(e => console.log('TOC fetch failed (expected if viewing via file://)', e));
    }
});
</script>
