    <g s:x="2" s:y="5" s:pid="A"/>
    <g s:x="2" s:y="20" s:pid="B"/>
    <g s:x="30" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="generic" transform="translate(12,146)" s:width="60" s:height="40" id="cell_VCC1">
    <text x="30" y="-4" class="nodelabel cell_VCC1" s:attribute="ref" text-anchor="middle">VCC</text>
    <rect fill="none" stroke="#000" width="60" height="26" s:generic="body" class="cell_VCC1"/>
    <g transform="translate(60,10)" s:x="60" s:y="10" s:pid="out0" id="port_VCC1~V">
      <text x="-3" y="3" class="pinOut cell_VCC1" text-anchor="end">V</text>
    </g>
  </g>
  <g s:type="reduce_xor" transform="translate(139,22)" s:width="33" s:height="25" id="cell_XOR1">
    <text x="15" y="-4" class="nodelabel cell_XOR1" s:attribute="ref" text-anchor="middle">XOR1</text>
    <s:alias val="$xor"/>
    <s:alias val="$reduce_xor"/>
    <s:alias val="$_XOR_"/>
    <path fill="none" stroke="#000" d="M3,0 A30 25 0 0 1 3,25 A30 25 0 0 0 33,12.5 A30 25 0 0 0 3,0" class="cell_XOR1"/>
    <path fill="none" stroke="#000" d="M0,0 A30 25 0 0 1 0,25" class="cell_XOR1"/>
    <g s:x="2" s:y="5" s:pid="A"/>
    <g s:x="2" s:y="20" s:pid="B"/>
    <g s:x="33" s:y="12.5" s:pid="Y"/>
  </g>
</svg>
