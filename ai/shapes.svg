    <g s:x="15" s:y="40" s:pid="ARST"/>
    <g s:x="15" s:y="40" s:pid="SRST"/>
  </g>
  <g s:type="generic" transform="translate(98,69)" s:width="30" s:height="40" id="cell_GND1">
