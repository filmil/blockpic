<svg xmlns="http://www.w3.org/2000/svg" xmlns:s="https://github.com/nturley/netlistsvg" width="224" height="198">
  <style>svg {
    stroke:#000;
    fill:none;
  }
  text {
    fill:#000;
    stroke:none;
    font-size:9px;
    font-weight: normal;
    font-family: Helvetica, Arial, sans-serif;
  }
  line {
      stroke-linecap: square;
  }
  .pinIn {
    text-anchor: start;
  }
  .pinOut {
    text-anchor: end;
  }
  .nodelabel {
    text-anchor: middle;
  }
  .inputPortLabel {
    text-anchor: end;
  }
  .splitjoinBody {
    fill:#000;
  }</style>
  <g s:type="and" transform="translate(55,22)" s:width="30" s:height="25" id="cell_AND1">
    <text x="15" y="-4" class="nodelabel cell_AND1" s:attribute="ref" text-anchor="middle">AND1</text>
    <s:alias val="$and"/>
    <s:alias val="$logic_and"/>
    <s:alias val="$_AND_"/>
    <s:alias val="$reduce_and"/>
    <path fill="none" stroke="#000" d="M0,0 L0,25 L15,25 A15 12.5 0 0 0 15,0 Z" class="cell_AND1"/>
    <g s:x="0" s:y="5" s:pid="A"/>
    <g s:x="0" s:y="20" s:pid="B"/>
    <g s:x="30" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="generic" transform="translate(64,84)" s:width="60" s:height="40" id="cell_CLK1">
    <text x="30" y="-4" class="nodelabel cell_CLK1" s:attribute="ref" text-anchor="middle">CLOCK</text>
    <rect fill="none" stroke="#000" width="60" height="26" s:generic="body" class="cell_CLK1"/>
    <g transform="translate(60,10)" s:x="60" s:y="10" s:pid="out0" id="port_CLK1~C">
      <text x="-3" y="3" class="pinOut cell_CLK1" text-anchor="end">C</text>
    </g>
  </g>
  <g s:type="generic" transform="translate(99,146)" s:width="60" s:height="40" id="cell_DEMUX1">
    <text x="30" y="-4" class="nodelabel cell_DEMUX1" s:attribute="ref" text-anchor="middle">DEMUX</text>
    <rect fill="none" stroke="#000" width="60" height="40" s:generic="body" class="cell_DEMUX1"/>
    <g transform="translate(0,10)" s:x="0" s:y="10" s:pid="in0" id="port_DEMUX1~I">
      <text x="3" y="3" class="pinIn cell_DEMUX1" text-anchor="start">I</text>
    </g>
    <g transform="translate(0,24)" s:x="0" s:y="10" s:pid="in0" id="port_DEMUX1~S">
      <text x="3" y="3" class="pinIn cell_DEMUX1" text-anchor="start">S</text>
    </g>
    <g transform="translate(60,10)" s:x="60" s:y="10" s:pid="out0" id="port_DEMUX1~O0">
      <text x="-3" y="3" class="pinOut cell_DEMUX1" text-anchor="end">O0</text>
    </g>
    <g transform="translate(60,24)" s:x="60" s:y="10" s:pid="out0" id="port_DEMUX1~O1">
      <text x="-3" y="3" class="pinOut cell_DEMUX1" text-anchor="end">O1</text>
    </g>
  </g>
  <g s:type="dff" transform="translate(12,84)" s:width="40" s:height="40" id="cell_DFF1">
    <text x="20" y="-4" class="nodelabel cell_DFF1" s:attribute="ref" text-anchor="middle">DFF1</text>
    <s:alias val="$dff"/>
    <s:alias val="$_DFF_"/>
    <s:alias val="$_DFF_P_"/>
    <s:alias val="$adff"/>
    <s:alias val="$_DFF_"/>
    <s:alias val="$_DFF_P_"/>
    <s:alias val="$sdff"/>
    <s:alias val="$_DFF_"/>
    <s:alias val="$_DFF_P_"/>
    <rect fill="none" stroke="#000" width="40" height="40" x="0" y="0" class="cell_DFF1"/>
    <text x="3" y="13" class="pinIn cell_DFF1" s:attribute="" text-anchor="start">D</text>
    <text x="3" y="33" class="pinIn cell_DFF1" s:attribute="" text-anchor="start">CK</text>
    <text x="37" y="13" class="pinOut cell_DFF1" s:attribute="" text-anchor="end">Q</text>
    <g s:x="40" s:y="10" s:pid="Q"/>
    <g s:x="0" s:y="30" s:pid="CLK"/>
    <g s:x="0" s:y="30" s:pid="C"/>
    <g s:x="0" s:y="10" s:pid="D"/>
    <g s:x="20" s:y="40" s:pid="ARST"/>
    <g s:x="20" s:y="40" s:pid="SRST"/>
  </g>
  <g s:type="generic" transform="translate(144,84)" s:width="60" s:height="40" id="cell_GND1">
    <text x="30" y="-4" class="nodelabel cell_GND1" s:attribute="ref" text-anchor="middle">GND</text>
    <rect fill="none" stroke="#000" width="60" height="26" s:generic="body" class="cell_GND1"/>
