      <text x="-3" y="3" class="pinOut cell_GND1" text-anchor="end">G</text>
    </g>
  </g>
  <g s:type="mux" transform="translate(184,22)" s:width="20" s:height="40" id="cell_MUX1">
    <text x="15" y="-4" class="nodelabel cell_MUX1" s:attribute="ref" text-anchor="middle">MUX1</text>
    <s:alias val="$pmux"/>
    <s:alias val="$mux"/>
    <s:alias val="$_MUX_"/>
    <path fill="none" stroke="#000" d="M0,0 L20,10 L20,30 L0,40 Z" class="cell_MUX1"/>
    <g s:x="0" s:y="10" s:pid="A"/>
    <g s:x="0" s:y="30" s:pid="B"/>
    <g s:x="10" s:y="35" s:pid="S"/>
    <g s:x="20" s:y="20" s:pid="Y"/>
  </g>
  <g s:type="not" transform="translate(13,22)" s:width="30" s:height="20" id="cell_NOT1">
    <text x="15" y="-4" class="nodelabel cell_NOT1" s:attribute="ref" text-anchor="middle">NOT1</text>
    <s:alias val="$_NOT_"/>
    <s:alias val="$not"/>
    <s:alias val="$logic_not"/>
    <path fill="none" stroke="#000" d="M0,0 L0,20 L20,10 Z" class="cell_NOT1"/>
    <circle fill="none" stroke="#000" cx="24" cy="10" r="3" class="cell_NOT1"/>
    <g s:x="-1" s:y="10" s:pid="A"/>
    <g s:x="27" s:y="10" s:pid="Y"/>
  </g>
  <g s:type="or" transform="translate(97,22)" s:width="30" s:height="25" id="cell_OR1">
    <text x="15" y="-4" class="nodelabel cell_OR1" s:attribute="ref" text-anchor="middle">OR1</text>
    <s:alias val="$or"/>
    <s:alias val="$logic_or"/>
    <s:alias val="$_OR_"/>
    <s:alias val="$reduce_or"/>
