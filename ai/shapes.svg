    <s:alias val="$and"/>
    <s:alias val="$logic_and"/>
    <s:alias val="$_AND_"/>
    <s:alias val="$reduce_and"/>
    <path d="M0,0 L0,25 L15,25 A15 12.5 0 0 0 15,0 Z" class="cell_AND1"/>
    <g s:x="0" s:y="5" s:pid="A"/>
    <g s:x="0" s:y="20" s:pid="B"/>
    <g s:x="30" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="generic" transform="translate(48,69)" s:width="30" s:height="40" id="cell_CLK1">
