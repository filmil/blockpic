  <g s:type="reduce_xor" transform="translate(139,22)" s:width="33" s:height="25" id="cell_XOR1">
    <text x="15" y="-4" class="nodelabel cell_XOR1" s:attribute="ref">XOR1</text>
    <s:alias val="$xor"/>
    <s:alias val="$reduce_xor"/>
    <s:alias val="$_XOR_"/>
