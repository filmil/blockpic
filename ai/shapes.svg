<svg xmlns="http://www.w3.org/2000/svg" xmlns:s="https://github.com/nturley/netlistsvg" width="198" height="186">
  <style>svg {
    stroke:#000;
    fill:none;
  }
  text {
    fill:#000;
    stroke:none;
    font-size:10px;
    font-weight: bold;
    font-family: "Courier New", monospace;
  }
  line {
      stroke-linecap: round;
  }
  .nodelabel {
    text-anchor: middle;
  }
  .inputPortLabel {
    text-anchor: end;
  }
  .splitjoinBody {
    fill:#000;
  }
  .net {
    marker-end: url(#arrow);
  }</style>
  <g s:type="and" transform="translate(55,22)" s:width="30" s:height="25" id="cell_AND1">
