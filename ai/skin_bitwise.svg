<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:s="https://github.com/nturley/netlistsvg" width="150" height="253">
  <style>svg {
    stroke:#000;
    fill:none;
  }
  text {
    fill:#000;
    stroke:none;
    font-size:10px;
    font-weight: bold;
    font-family: "Courier New", monospace;
  }
  line {
      stroke-linecap: round;
  }
  .nodelabel {
    text-anchor: middle;
  }
  .inputPortLabel {
    text-anchor: end;
  }
  .splitjoinBody {
    fill:#000;
  }
  .net {
    marker-end: url(#arrow);
  }</style>
  <g s:type="generic" transform="translate(84,150)" s:width="30" s:height="40" id="cell_LOGIC_NOT">
    <text x="15" y="-4" class="nodelabel cell_LOGIC_NOT" s:attribute="ref">logic_not</text>
    <rect width="30" height="20" s:generic="body" class="cell_LOGIC_NOT"/>
    <g transform="translate(0,10)" s:x="0" s:y="10" s:pid="in0" id="port_LOGIC_NOT~A">
      <text x="-3" y="-4" class="inputPortLabel cell_LOGIC_NOT">A</text>
    </g>
    <g transform="translate(30,10)" s:x="30" s:y="10" s:pid="out0" id="port_LOGIC_NOT~Y">
      <text x="5" y="-4" style="fill:#000; stroke:none" class="cell_LOGIC_NOT">Y</text>
    </g>
  </g>
  <g s:type="generic" transform="translate(84,218)" s:width="30" s:height="40" id="cell_RED_AND">
    <text x="15" y="-4" class="nodelabel cell_RED_AND" s:attribute="ref">reduce_and</text>
    <rect width="30" height="20" s:generic="body" class="cell_RED_AND"/>
