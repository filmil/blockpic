    <g transform="translate(30,10)" s:x="30" s:y="10" s:pid="out0" id="port_RED_OR~Y">
      <text x="5" y="-4" style="fill:#000; stroke:none" class="cell_RED_OR">Y</text>
    </g>
  </g>
  <g s:type="reduce_xor" transform="translate(84,80)" s:width="33" s:height="25" id="cell_RED_XOR">
    <s:alias val="$xor"/>
    <s:alias val="$reduce_xor"/>
    <s:alias val="$_XOR_"/>
    <path d="M3,0 A30 25 0 0 1 3,25 A30 25 0 0 0 33,12.5 A30 25 0 0 0 3,0" class="cell_RED_XOR"/>
    <path d="M0,0 A30 25 0 0 1 0,25" class="cell_RED_XOR"/>
    <g s:x="2" s:y="5" s:pid="A"/>
    <g s:x="2" s:y="20" s:pid="B"/>
    <g s:x="33" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="inputExt" transform="translate(12,22.5)" s:width="30" s:height="20" id="cell_IN_A">
    <text x="15" y="-4" class="nodelabel cell_IN_A" s:attribute="ref">IN_A</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="cell_IN_A"/>
    <g s:x="30" s:y="10" s:pid="Y"/>
  </g>
