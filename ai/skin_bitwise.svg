      <text x="5" y="-4" style="fill:#000; stroke:none" class="cell_RED_AND">Y</text>
    </g>
  </g>
  <g s:type="generic" transform="translate(84,22)" s:width="30" s:height="40" id="cell_RED_OR">
    <text x="15" y="-4" class="nodelabel cell_RED_OR" s:attribute="ref">reduce_or</text>
    <rect width="30" height="20" s:generic="body" class="cell_RED_OR"/>
    <g transform="translate(0,10)" s:x="0" s:y="10" s:pid="in0" id="port_RED_OR~A">
      <text x="-3" y="-4" class="inputPortLabel cell_RED_OR">A</text>
