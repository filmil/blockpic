<svg xmlns="http://www.w3.org/2000/svg" xmlns:s="https://github.com/nturley/netlistsvg" width="164" height="229">
  <style>svg {
    stroke:#000;
    fill:none;
  }
  text {
    fill:#000;
    stroke:none;
    font-size:9px;
    font-weight: normal;
    font-family: Helvetica, Arial, sans-serif;
  }
  line {
      stroke-linecap: square;
  }
  .pinIn {
    text-anchor: start;
  }
  .pinOut {
    text-anchor: end;
  }
  .nodelabel {
    text-anchor: middle;
  }
  .inputPortLabel {
    text-anchor: end;
  }
  .splitjoinBody {
    fill:#000;
  }</style>
  <g s:type="generic" transform="translate(84,121)" s:width="60" s:height="40" id="cell_BUF">
    <text x="30" y="-4" class="nodelabel cell_BUF" s:attribute="ref">$buf</text>
    <rect width="60" height="26" s:generic="body" class="cell_BUF"/>
    <g transform="translate(0,10)" s:x="0" s:y="10" s:pid="in0" id="port_BUF~A">
      <text x="3" y="3" class="pinIn cell_BUF">A</text>
    </g>
    <g transform="translate(60,10)" s:x="60" s:y="10" s:pid="out0" id="port_BUF~Y">
      <text x="-3" y="3" class="pinOut cell_BUF">Y</text>
    </g>
  </g>
  <g s:type="pos" transform="translate(84,192)" s:width="25" s:height="25" id="cell_POS">
    <text x="15" y="-4" class="nodelabel cell_POS" s:attribute="ref">POS</text>
    <s:alias val="$pos"/>
    <circle r="12.5" cx="12.5" cy="12.5" class="cell_POS"/>
    <line x1="7.5" x2="17.5" y1="12.5" y2="12.5" class="cell_POS"/>
    <line x1="12.5" x2="12.5" y1="7.5" y2="17.5" class="cell_POS"/>
    <g s:x="-1" s:y="12.5" s:pid="A"/>
    <g s:x="26" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="tribuf" transform="translate(84,46)" s:width="15" s:height="30" id="cell_TRIBUF">
    <text x="15" y="-4" class="nodelabel cell_TRIBUF" s:attribute="ref">TRIBUF</text>
    <s:alias val="$tribuf"/>
    <s:alias val="$_TRIBUF_"/>
    <s:alias val="tribuf-bus"/>
    <s:alias val="$tribuf-bus"/>
    <s:alias val="$_TRIBUF_-bus"/>
    <path d="M0,0 L25,15 L0,30 Z" class="cell_TRIBUF"/>
    <g s:x="0" s:y="15" s:pid="A"/>
    <g s:x="11" s:y="6" s:pid="EN"/>
    <g s:x="25" s:y="15" s:pid="Y"/>
  </g>
  <g s:type="inputExt" transform="translate(12,199.5)" s:width="20" s:height="10" id="cell_IN_A">
    <text x="0" y="-3" class="pinIn cell_IN_A" s:attribute="ref">IN_A</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,10 L14,10 L20,5 L14,0 Z" class="cell_IN_A"/>
    <g s:x="20" s:y="5" s:pid="Y"/>
  </g>
  <g s:type="inputExt" transform="translate(12,21)" s:width="20" s:height="10" id="cell_IN_EN">
    <text x="0" y="-3" class="pinIn cell_IN_EN" s:attribute="ref">IN_EN</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,10 L14,10 L20,5 L14,0 Z" class="cell_IN_EN"/>
    <g s:x="20" s:y="5" s:pid="Y"/>
  </g>
  <line x1="32" x2="52" y1="204.5" y2="204.5" class="net_2"/>
  <line x1="52" x2="52" y1="204.5" y2="131.5" class="net_2"/>
  <circle cx="52" cy="204.5" r="2" style="fill:#000" class="net_2"/>
  <circle cx="52" cy="131.5" r="2" style="fill:#000" class="net_2"/>
  <line x1="52" x2="84" y1="131.5" y2="131.5" class="net_2"/>
  <line x1="32" x2="83" y1="204.5" y2="204.5" class="net_2"/>
  <line x1="32" x2="52" y1="204.5" y2="204.5" class="net_2"/>
  <line x1="52" x2="52" y1="204.5" y2="61" class="net_2"/>
  <line x1="52" x2="84" y1="61" y2="61" class="net_2"/>
