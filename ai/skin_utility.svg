<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:s="https://github.com/nturley/netlistsvg" width="140" height="213">
  <style>svg {
    stroke:#000;
    fill:none;
  }
  text {
    fill:#000;
    stroke:none;
    font-size:10px;
    font-weight: bold;
    font-family: "Courier New", monospace;
  }
  .nodelabel {
    text-anchor: middle;
  }
  .inputPortLabel {
    text-anchor: end;
  }
  .splitjoinBody {
    fill:#000;
  }</style>
  <g s:type="generic" transform="translate(90,22)" s:width="30" s:height="40" id="cell_BUF">
    <text x="15" y="-4" class="nodelabel cell_BUF" s:attribute="ref">$buf</text>
    <rect width="30" height="20" s:generic="body" class="cell_BUF"/>
    <g transform="translate(0,10)" s:x="0" s:y="10" s:pid="in0" id="port_BUF~A">
      <text x="-3" y="-4" class="inputPortLabel cell_BUF">A</text>
    </g>
    <g transform="translate(30,10)" s:x="30" s:y="10" s:pid="out0" id="port_BUF~Y">
      <text x="5" y="-4" style="fill:#000; stroke:none" class="cell_BUF">Y</text>
    </g>
  </g>
  <g s:type="generic" transform="translate(90,90)" s:width="30" s:height="40" id="cell_POS">
    <text x="15" y="-4" class="nodelabel cell_POS" s:attribute="ref">$pos</text>
    <rect width="30" height="20" s:generic="body" class="cell_POS"/>
    <g transform="translate(0,10)" s:x="0" s:y="10" s:pid="in0" id="port_POS~A">
      <text x="-3" y="-4" class="inputPortLabel cell_POS">A</text>
    </g>
    <g transform="translate(30,10)" s:x="30" s:y="10" s:pid="out0" id="port_POS~Y">
      <text x="5" y="-4" style="fill:#000; stroke:none" class="cell_POS">Y</text>
    </g>
  </g>
  <g s:type="generic" transform="translate(90,158)" s:width="30" s:height="40" id="cell_TRIBUF">
    <text x="15" y="-4" class="nodelabel cell_TRIBUF" s:attribute="ref">$tribuf</text>
    <rect width="30" height="40" s:generic="body" class="cell_TRIBUF"/>
    <g transform="translate(0,10)" s:x="0" s:y="10" s:pid="in0" id="port_TRIBUF~A">
      <text x="-3" y="-4" class="inputPortLabel cell_TRIBUF">A</text>
    </g>
    <g transform="translate(0,30)" s:x="0" s:y="10" s:pid="in0" id="port_TRIBUF~EN">
      <text x="-3" y="-4" class="inputPortLabel cell_TRIBUF">EN</text>
    </g>
    <g transform="translate(30,10)" s:x="30" s:y="10" s:pid="out0" id="port_TRIBUF~Y">
      <text x="5" y="-4" style="fill:#000; stroke:none" class="cell_TRIBUF">Y</text>
    </g>
  </g>
  <g s:type="inputExt" transform="translate(12,22.5)" s:width="30" s:height="20" id="cell_IN_A">
    <text x="15" y="-4" class="nodelabel cell_IN_A" s:attribute="ref">IN_A</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="cell_IN_A"/>
    <g s:x="28" s:y="10" s:pid="Y"/>
  </g>
  <g s:type="inputExt" transform="translate(12,178.5)" s:width="30" s:height="20" id="cell_IN_EN">
    <text x="15" y="-4" class="nodelabel cell_IN_EN" s:attribute="ref">IN_EN</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="cell_IN_EN"/>
    <g s:x="28" s:y="10" s:pid="Y"/>
  </g>
  <line x1="40" x2="90" y1="32.5" y2="32.5" class="net_2"/>
  <line x1="40" x2="52" y1="32.5" y2="32.5" class="net_2"/>
  <line x1="52" x2="52" y1="32.5" y2="100.5" class="net_2"/>
  <circle cx="52" cy="32.5" r="2" style="fill:#000" class="net_2"/>
  <circle cx="52" cy="100.5" r="2" style="fill:#000" class="net_2"/>
  <line x1="52" x2="90" y1="100.5" y2="100.5" class="net_2"/>
  <line x1="40" x2="52" y1="32.5" y2="32.5" class="net_2"/>
  <line x1="52" x2="52" y1="32.5" y2="168.5" class="net_2"/>
  <line x1="52" x2="90" y1="168.5" y2="168.5" class="net_2"/>
  <line x1="40" x2="90" y1="188.5" y2="188.5" class="net_3"/>
</svg>
