<svg xmlns="http://www.w3.org/2000/svg" xmlns:s="https://github.com/nturley/netlistsvg" width="195" height="76.5">
  <style>svg {
    stroke:#000;
    fill:none;
  }
  text {
    fill:#000;
    stroke:none;
    font-size:9px;
    font-weight: normal;
    font-family: Helvetica, Arial, sans-serif;
  }
  line {
      stroke-linecap: square;
  }
  .pinIn {
    text-anchor: start;
  }
  .pinOut {
    text-anchor: end;
  }
  .nodelabel {
    text-anchor: middle;
  }
  .inputPortLabel {
    text-anchor: end;
  }
  .splitjoinBody {
    fill:#000;
  }</style>
  <g s:type="and" transform="translate(12,22)" s:width="30" s:height="25" id="cell_A">
    <text x="15" y="-4" class="nodelabel cell_A" s:attribute="ref" text-anchor="middle">A</text>
    <s:alias val="$and"/>
    <s:alias val="$logic_and"/>
    <s:alias val="$_AND_"/>
    <s:alias val="$reduce_and"/>
    <path fill="none" stroke="#000" d="M0,0 L0,25 L15,25 A15 12.5 0 0 0 15,0 Z" class="cell_A"/>
    <g s:x="0" s:y="5" s:pid="A"/>
    <g s:x="0" s:y="20" s:pid="B"/>
    <g s:x="30" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="dff" transform="translate(77,24.5)" s:width="40" s:height="40" id="cell_B">
    <text x="20" y="-4" class="nodelabel cell_B" s:attribute="ref" text-anchor="middle">B</text>
    <s:alias val="$dff"/>
    <s:alias val="$_DFF_"/>
    <s:alias val="$_DFF_P_"/>
    <s:alias val="$adff"/>
    <s:alias val="$_DFF_"/>
    <s:alias val="$_DFF_P_"/>
    <s:alias val="$sdff"/>
    <s:alias val="$_DFF_"/>
    <s:alias val="$_DFF_P_"/>
    <rect fill="none" stroke="#000" width="40" height="40" x="0" y="0" class="cell_B"/>
    <text x="3" y="13" class="pinIn cell_B" s:attribute="" text-anchor="start">D</text>
    <text x="3" y="33" class="pinIn cell_B" s:attribute="" text-anchor="start">CK</text>
    <text x="37" y="13" class="pinOut cell_B" s:attribute="" text-anchor="end">Q</text>
    <g s:x="40" s:y="10" s:pid="Q"/>
    <g s:x="0" s:y="30" s:pid="CLK"/>
    <g s:x="0" s:y="30" s:pid="C"/>
    <g s:x="0" s:y="10" s:pid="D"/>
    <g s:x="20" s:y="40" s:pid="ARST"/>
    <g s:x="20" s:y="40" s:pid="SRST"/>
  </g>
  <g s:type="not" transform="translate(153,24.5)" s:width="30" s:height="20" id="cell_C">
    <text x="15" y="-4" class="nodelabel cell_C" s:attribute="ref" text-anchor="middle">C</text>
    <s:alias val="$_NOT_"/>
    <s:alias val="$not"/>
    <s:alias val="$logic_not"/>
    <path fill="none" stroke="#000" d="M0,0 L0,20 L20,10 Z" class="cell_C"/>
    <circle fill="none" stroke="#000" cx="24" cy="10" r="3" class="cell_C"/>
    <g s:x="-1" s:y="10" s:pid="A"/>
    <g s:x="27" s:y="10" s:pid="Y"/>
  </g>
  <line x1="42" x2="77" y1="34.5" y2="34.5" class="net_2" stroke="#000"/>
  <line x1="117" x2="152" y1="34.5" y2="34.5" class="net_3" stroke="#000"/>
</svg>
