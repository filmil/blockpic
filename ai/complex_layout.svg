      <text x="5" y="-4" style="fill:#000; stroke:none" class="cell_IN2">O</text>
    </g>
  </g>
  <g s:type="not" transform="translate(215,22.5)" s:width="30" s:height="20" id="cell_NOT1">
    <s:alias val="$_NOT_"/>
    <s:alias val="$not"/>
    <s:alias val="$logic_not"/>
    <path d="M0,0 L0,20 L20,10 Z" class="cell_NOT1"/>
